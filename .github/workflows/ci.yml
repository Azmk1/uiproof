name: CI

# Every check the project claims passes on `main` is run here, in the order the mission
# defines: install → lint → typecheck → unit tests → production build → browser suite.
on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "1"

jobs:
  checks:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm reads the exact version from `packageManager`, so the lockfile and CI
      # can never disagree about which pnpm wrote it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The browser suite drives `next start`, so the build above has to exist first.
      # `--with-deps` installs the shared libraries Chromium needs on the runner image.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser suite
        run: pnpm test:e2e
