name: Visual regression gate

# The real quality gate: a pull request builds and runs its proposed application code, and the
# verdict comes from comparing it with an approved baseline that the pull request cannot write
# to.
#
# What makes this trustworthy, in one paragraph. The reference is extracted from the pull
# request's **base branch** with `git archive`, so a pull request cannot authorise its own
# visual change by editing `examples/uiproof-baselines` in the same pull request — the gate
# reads the committed base, not the working tree. Nothing in this job captures or approves
# anything: `run-gate.sh` starts the application, loads the approved baseline, compares, and
# exits with the CLI's own code, which is the job's verdict. The whole job runs inside the
# pinned rendering image, so the reference and the screenshot under test were rendered by the
# same Chromium and the same fonts.
#
#   0  the comparison passed                       → the job succeeds
#   1  a visual regression was detected            → the job fails
#   2  baseline, configuration, browser or
#      infrastructure failure                     → the job fails
#
# A regression fails this job rather than being asserted as an expected exit code. The
# walkthrough that does check for exit 1 deliberately is `visual-regression-demo.yml`, and it
# is not a gate.
#
# The job needs read access to the repository and nothing else: no secret is configured, no
# secret is referenced, and the repository token is never handed to the application under test
# (scripts/ci/lib.sh starts it with `env -i`). Screenshots, diffs and reports are uploaded
# whether the comparison passes or fails.
#
# Two things a repository using this workflow must configure by hand — GitHub does not let a
# workflow protect itself (see docs/BASELINE-UPDATES.md):
#   * a branch protection rule on the base branch requiring the check "gate · trusted baseline"
#     to pass, so a red gate blocks the merge instead of merely being visible;
#   * a review requirement (CODEOWNERS already routes examples/uiproof-baselines to its owner)
#     so that changing the baseline is a reviewed operation, not a side effect.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-regression-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  UIPROOF_CONFIG: examples/ci/uiproof.config.json
  UIPROOF_PROJECT: example-app
  UIPROOF_ROUTE: home
  UIPROOF_VIEWPORT: desktop
  UIPROOF_BUNDLE_PATH: examples/uiproof-baselines
  # The commit the reference comes from: the pull request's target branch, or the branch this
  # push landed on. A pull request cannot write to either.
  TRUSTED_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
  TRUSTED_DIR: ${{ runner.temp }}/uiproof/trusted-baseline
  WORK: ${{ runner.temp }}/uiproof/gate

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate · trusted baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The pinned rendering environment. Tag = the Playwright release, digest = the bytes:
    # Chromium, fonts, fontconfig and libc all come from this image, which is what makes the
    # committed baseline and this runner's screenshot comparable. Keep it in step with
    # package.json and scripts/ci/lib.sh — src/lib/ci/pinned-environment.test.ts fails the
    # unit suite if they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf

    steps:
      - name: Checkout the proposed code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract the approved baseline from the base branch
        # `git archive` reads the committed tree of the base branch. Anything the pull request
        # did to its own copy of the bundle is compared, reported and then ignored.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          echo "base branch: $TRUSTED_REF (pull request base $BASE_SHA)"
          mkdir -p "$WORK"
          git fetch --no-tags --depth=1 origin "$TRUSTED_REF"
          echo "base branch tip: $(git rev-parse FETCH_HEAD)"
          bash scripts/ci/trusted-baseline.sh \
            --from-ref FETCH_HEAD \
            --into "$TRUSTED_DIR" \
            --path "$UIPROOF_BUNDLE_PATH" \
            --provenance "$WORK/trusted-baseline.txt"

      - name: Gate the proposed code against it
        # One step, because it is one decision: start the application under test, load the
        # trusted baseline, compare, report, and exit with the comparison's own code. There is
        # no capture and no approval anywhere in it.
        run: |
          bash scripts/ci/run-gate.sh \
            --bundle "$TRUSTED_DIR" \
            --store "$WORK/store" \
            --artifacts "$WORK/artifacts" \
            --config "$UIPROOF_CONFIG" \
            --project "$UIPROOF_PROJECT" \
            --route "$UIPROOF_ROUTE" \
            --viewport "$UIPROOF_VIEWPORT"

      - name: Upload the reports, screenshots and diffs
        # Whether the comparison passed, failed or could not run: a regression has to be
        # reviewable from the artifacts alone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiproof-gate
          path: |
            ${{ env.WORK }}
            ${{ env.TRUSTED_DIR }}
          if-no-files-found: warn
          retention-days: 30
